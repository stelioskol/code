<!DOCTYPE html>
<html lang="el">
<head>

<link rel="apple-touch-icon" href="icon.png?v=6">

<title>Ημερολόγιο</title>
<style>
:root{--b1:#2a2024;--b2:#4a2f1a;--b3:#3a2548;--ink:#fff;--mute:rgba(255,255,255,.55);--glass:rgba(255,255,255,.09);--line:rgba(255,255,255,.12);--sheet:#26212b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;color:var(--ink);background:radial-gradient(circle at 12% 0,var(--b2),transparent 55%),radial-gradient(circle at 100% 25%,var(--b3),transparent 50%),var(--b1);font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.glass,.pill,.nv{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
header{padding:10px 16px 6px}
.top{display:flex;gap:8px;align-items:center}.sp{flex:1}
.pill{height:42px;padding:0 16px;border-radius:21px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.ttl{display:flex;align-items:center;gap:8px;margin-top:10px}
.ttl>div{flex:1;min-width:0}
h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.3px;text-transform:capitalize}
#st{margin:0;color:var(--mute);font-size:13px;font-weight:600}
.nv{width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1;padding-bottom:2px}
#td{height:36px;font-size:14px;padding:0 14px}
#main{flex:1;min-height:0;overflow-y:auto;padding:0 16px 30px;touch-action:pan-y;position:relative;scrollbar-width:none}
#main::-webkit-scrollbar{display:none}
#main.vl,#main.vm{padding-top:6px}
.stk{position:sticky;top:0;z-index:3;margin:0 -16px;padding:6px 16px 12px;background:linear-gradient(to bottom,color-mix(in srgb,var(--b1) 88%,transparent) 75%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(to bottom,#000 80%,transparent);mask-image:linear-gradient(to bottom,#000 80%,transparent)}
.dh{margin:18px 2px 8px;font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--mute)}
.em{color:var(--mute);text-align:center;padding:20px;font-weight:600}
.tk{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:10px;border-radius:22px}
.bar{flex:none;width:3px;align-self:stretch;border-radius:3px;background:var(--c)}
.tb{flex:1;min-width:0;font-size:16px;font-weight:600;line-height:1.3;word-break:break-word}
.tm{font-size:13px;color:var(--mute);text-align:right;line-height:1.5;font-variant-numeric:tabular-nums}
.tk.done .tb{text-decoration:line-through;opacity:.5}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;transition:.2s}
.chk.on{background:var(--c);border-color:var(--c)}
.chk svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.9,.5,1)}
.chk.on svg{transform:scale(1)}
.strip{display:flex;gap:6px}
.sd{flex:1;padding:9px 0;border-radius:18px;text-align:center}
.sd b{display:block;font-size:17px}.sd small{font-size:12px;color:var(--mute);font-weight:600}
.sd.on{background:var(--ink);color:var(--b1);border-color:transparent}.sd.on small{color:var(--b1);opacity:.7}
.sd.today:not(.on) b{color:#ff6b8a}
.tl{position:relative;display:flex;margin-top:10px}
.gut{width:40px;flex:none;position:relative}
.gut span{position:absolute;right:7px;font-size:11px;color:var(--mute);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.cols{flex:1;display:grid;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 55px,var(--line) 55px,var(--line) 56px)}
.col{position:relative;border-left:1px solid var(--line)}
.blk{position:absolute;display:flex;gap:7px;align-items:flex-start;padding:5px 5px 4px;border-radius:10px;border-top:3px solid var(--c);background:var(--glass);background:color-mix(in srgb,var(--c) 26%,transparent);overflow:hidden;font-size:11.5px;font-weight:600;line-height:1.2;word-break:break-word}
.blk .bt{min-width:0}.blk small{display:block;font-size:11px;opacity:.65;margin-top:2px}
.blk .chk{width:22px;height:22px;border-width:2px}.blk .chk svg{width:12px;height:12px}
.tl.solo .blk{font-size:14px;padding:7px 9px}
.tl:not(.solo) .blk{padding:3px 1px 2px;font-size:10px;text-align:center;justify-content:center;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.tl:not(.solo) .e{display:block;font-size:15px;line-height:1.25}
.blk.nr .bt b{font-size:0}.blk.nr .e{font-size:15px}
.blk.done{opacity:.45}
.nl{position:absolute;left:0;right:0;height:2px;background:#ff5577;z-index:2}
.nl:before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#ff5577}
.wh,.wu{display:grid;grid-template-columns:40px repeat(7,1fr)}
.stk .wu{margin-top:4px}
.wh button{padding:4px 0;text-align:center}
.wh small{display:block;font-size:12px;color:var(--mute);font-weight:600}
.wh b{display:block;width:32px;height:32px;line-height:32px;margin:2px auto 0;border-radius:50%;font-size:15px}
.wh .t b{background:var(--ink);color:var(--b1)}
.wu{margin-top:6px}.wu div{padding:0 1px;min-width:0}
.wu i{display:block;font-style:normal;font-size:10px;font-weight:700;padding:2px 4px;margin-bottom:2px;border-radius:6px;background:var(--c);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wu em{font-size:10px;color:var(--mute);font-style:normal}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mh{text-align:center;color:var(--mute);font-weight:700;font-size:12px;padding:4px 0}
.mc{min-height:64px;padding:7px 2px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:15px}
.mc.off{opacity:.35}
.mc.tdy{background:var(--ink);color:var(--b1);border-color:transparent}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;padding:0 3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:20}
#ov.on{display:flex}
#sh{width:100%;max-height:90%;overflow-y:auto;background:var(--sheet);border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease;border:1px solid var(--line)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.f{display:flex;flex-direction:column;gap:12px}
.f input,.f select{font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px;width:100%;min-height:46px;-webkit-user-select:text;user-select:text;outline:0}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.r2 label,.ck{font-size:13px;color:var(--mute);font-weight:600;display:flex;flex-direction:column;gap:5px}
.ck{flex-direction:row;align-items:center;gap:10px;font-size:16px;color:var(--ink)}.ck input{width:22px;min-height:22px}
.cp{display:flex;gap:11px;justify-content:space-between}
.cp i{width:32px;height:32px;border-radius:50%;background:var(--c);border:3px solid transparent}
.cp i.on{border-color:var(--ink)}
.btn{height:50px;border-radius:16px;font-weight:700;font-size:16px;background:var(--ink);color:var(--b1)}
.btn.g{background:var(--glass);color:var(--ink)}.btn.r{color:#ff6b6b}
.opt{display:flex;gap:14px;align-items:center;padding:12px;border-radius:18px;text-align:left;width:100%}
.opt.on{background:var(--glass)}
.opt b{display:block;font-size:17px}.opt small{color:var(--mute);font-size:13px}
.oi{width:44px;height:44px;border-radius:50%;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;font-size:20px}
.ths{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ths button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:600;text-align:center}
.ths i{width:60px;height:60px;border-radius:50%}
.ths .on i{box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--ink)}
.cf{position:fixed;pointer-events:none;z-index:30;font-size:20px;animation:fly .95s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rt));opacity:0}}
@media (prefers-reduced-motion:reduce){.cf{display:none}}
</style>
</head>
<body>
<header>
<div class="top"><button class="pill" id="vb"><span id="vi">▭</span><span id="vn">Μέρα</span></button><span class="sp"></span><button class="pill" id="nw">＋ Νέο</button><button class="pill" id="tb" aria-label="Θέμα">🎨</button></div>
<div class="ttl"><button class="nv" id="pv" aria-label="Πίσω">‹</button><div><h1 id="tt"></h1><p id="st"></p></div><button class="nv" id="nx" aria-label="Μπροστά">›</button><button class="pill" id="td">Σήμερα</button></div>
</header>
<main id="main"></main>
<div id="ov"><div id="sh"></div></div>
<script>
const WD=['Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο','Κυριακή'],SH=['Δευ','Τρί','Τετ','Πέμ','Παρ','Σάβ','Κυρ'],LT=['Δ','Τ','Τ','Π','Π','Σ','Κ'];
const MN=['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'];
const MS=['Ιαν','Φεβ','Μαρ','Απρ','Μαΐ','Ιουν','Ιουλ','Αυγ','Σεπ','Οκτ','Νοε','Δεκ'];
const PAL=['#ff4d8d','#ff9f1c','#2ecc71','#3b82f6','#a855f7','#facc15','#14b8a6','#ef4444'];
const TH={dusk:['Ηλιοβασίλεμα','#2a2024','#4a2f1a','#3a2548'],verdant:['Πράσινη ηρεμία','#12231f','#0e4a3f','#2b3a38'],ocean:['Βαθύς ωκεανός','#0b1020','#1d2d52','#14162e'],violet:['Μωβ νύχτα','#150f25','#3b1d6e','#24114a'],rose:['Ροζ δύση','#2a1420','#6b1f3d','#3a1a2c'],light:['Φως','#f4efff','#ffd9ec','#cfe8ff']};
const VW={l:['☰','Λίστα','Ιδανική για γρήγορη ματιά'],d:['▭','Μέρα','Ιδανική για φορτωμένες μέρες'],w:['▥','Εβδομάδα','Ιδανική για προγραμματισμό'],m:['▦','Μήνας','Ιδανική για σύνοψη']};
const CF=['✨','🎉','⭐','💜','🔥','🌊','🎈'],POOL=['⭐','🔥','🌊','🎈','🍀','🚀','💡','🎯','🧩','🌿'];
const MAP=[['γυμν|gym|τρεξ|workout','💪'],['καφ','☕'],['ψων|σουπερ|market','🛒'],['δουλει|meeting|σχολει|μαθημ|διαβασ','💼'],['φαγ|μαγειρ|δειπν|μεσημερ','🍝'],['φιλ|βολτ|εξοδ|ποτο','🥂'],['ραντεβ|γιατρ|οδοντ','🩺'],['πληρωμ|λογαρ|τραπεζ','💸'],['καθαρ|σπιτι|πλυντ','🧺'],['ταξιδ|πτηση|αεροπ','✈️'],['τηλεφων|καλεσ|καλω','📞'],['μουσικ|συναυλ','🎧'],['ταινι|σειρα|netflix','🍿'],['γενεθλ|δωρο','🎁'],['αγορ|παραγγ','📦']];
const CK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),K=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const[y,m,d]=k.split('-');return new Date(+y,m-1,+d)};
const wd=d=>(d.getDay()+6)%7,addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},mon=d=>addD(d,-wd(d));
const m2t=m=>pad(m/60|0)+':'+pad(m%60),t2m=t=>{const[h,m]=t.split(':');return +h*60+ +m};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ς/g,'σ');
function emo(t){const m=t.match(/^\p{Extended_Pictographic}\uFE0F?/u);if(m)return[m[0],t.slice(m[0].length).trim()||t];const n=norm(t);for(const[k,e]of MAP)if(new RegExp(k).test(n))return[e,t];return[POOL[Math.random()*POOL.length|0],t]}
const now=new Date();now.setHours(0,0,0,0);
const KEY='cal-v3';
let S={t:{}};try{S=JSON.parse(localStorage.getItem(KEY))||JSON.parse(localStorage.getItem('week-cards-v2'))||S}catch(e){}
S.t=S.t||{};
if(!S.seeded&&!Object.keys(S.t).length){S.seeded=1;S.t[K(now)]=[{id:'hi',t:'Πάτα «＋ Νέο» για ώρα και χρώμα',e:'✨',d:false}]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const col=(x,d)=>PAL[x.c!=null?x.c:wd(d)],srt=k=>(S.t[k]||[]).slice().sort((a,b)=>(a.s==null?-1:a.s)-(b.s==null?-1:b.s)),find=(k,id)=>(S.t[k]||[]).find(x=>x.id==id);
const main=$('main');let V=S.v||'d',cur=new Date(now),ed=null;
function applyTh(id){const t=TH[id]||TH.dusk,l=id=='light',r=document.documentElement.style;
  [['--b1',t[1]],['--b2',t[2]],['--b3',t[3]],['--ink',l?'#261c3d':'#fff'],['--mute',l?'rgba(38,28,61,.55)':'rgba(255,255,255,.55)'],['--glass',l?'rgba(255,255,255,.7)':'rgba(255,255,255,.09)'],['--line',l?'rgba(38,28,61,.12)':'rgba(255,255,255,.12)'],['--sheet',l?'#fff':'#26212b']].forEach(([a,b])=>r.setProperty(a,b));
  r.colorScheme=l?'light':'dark';document.querySelector('meta[name=theme-color]').content=t[1]}
function row(x,k,d){return `<div class="tk glass${x.d?' done':''}" data-a="edit" data-k="${k}" data-id="${x.id}" style="--c:${col(x,d)}"><button class="chk${x.d?' on':''}" data-a="tg">${CK}</button><i class="bar"></i><div class="tb">${x.e} ${esc(x.t)}</div><div class="tm">${x.s!=null?m2t(x.s)+(x.n!=null?'<br>'+m2t(x.n):''):''}</div></div>`}
function listV(){const td=K(now),ks=[...new Set([td,...Object.keys(S.t).filter(k=>k>td&&S.t[k].length)])].sort();
  return ks.map(k=>{const d=parse(k),a=srt(k);return `<h3 class="dh">${d.toLocaleDateString('el-GR',{weekday:'long',day:'numeric',month:'long'})}${k==td?' · ΣΗΜΕΡΑ':''}</h3>`+(a.map(x=>row(x,k,d)).join('')||'<p class="em">Τίποτα ακόμα ✨</p>')}).join('')}
const end=x=>Math.max(x.n!=null?x.n:x.s+45,x.s+30);
function lay(ar){const res=[];let cl=[],ce=-1;
  const fl=()=>{const ln=[],r=cl.map(x=>{let i=ln.findIndex(e=>e<=x.s);if(i<0)i=ln.length;ln[i]=end(x);return[x,i]});r.forEach(q=>res.push([q[0],q[1],ln.length]));cl=[]};
  ar.forEach(x=>{if(cl.length&&x.s>=ce){fl();ce=-1}cl.push(x);ce=Math.max(ce,end(x))});fl();return res}
function tl(keys){
  const all=keys.flatMap(k=>S.t[k]||[]).filter(x=>x.s!=null),PX=56,td=K(now),nd=new Date(),nm=nd.getHours()*60+nd.getMinutes(),solo=keys.length==1;
  const a=Math.min(8,...all.map(x=>x.s/60|0)),b=Math.min(24,Math.max(18,...all.map(x=>Math.ceil(end(x)/60)))+1);
  const cols=keys.map(k=>{const d=parse(k),ar=srt(k).filter(x=>x.s!=null);
    return `<div class="col">`+lay(ar).map(([x,i,n])=>{const hh=(end(x)-x.s)/60*PX;return `<div class="blk${x.d?' done':''}${!solo&&n>1?' nr':''}" data-a="edit" data-k="${k}" data-id="${x.id}" style="--c:${col(x,d)};top:${(x.s/60-a)*PX}px;height:${hh}px;left:${i*100/n}%;width:${100/n}%">${solo?`<button class="chk${x.d?' on':''}" data-a="tg">${CK}</button>`:''}<div class="bt"><b><span class="e">${x.e}</span> ${esc(x.t)}</b>${solo&&hh>=50?`<small>${m2t(x.s)}${x.n!=null?' – '+m2t(x.n):''}</small>`:''}</div></div>`}).join('')+(k==td&&nm/60>=a&&nm/60<=b?`<i class="nl" style="top:${(nm/60-a)*PX}px"></i>`:'')+'</div>'}).join('');
  let g='';for(let h=a;h<=b;h++)g+=`<span style="top:${(h-a)*PX}px">${pad(h)}:00</span>`;
  return `<div class="tl${solo?' solo':''}" style="height:${(b-a)*PX}px"><div class="gut">${g}</div><div class="cols" style="grid-template-columns:repeat(${keys.length},1fr)">${cols}</div></div>`}
function dayV(){const m=mon(cur),k=K(cur);
  return `<div class="stk"><div class="strip">${[...Array(7)].map((_,i)=>{const d=addD(m,i),kk=K(d);return `<button class="sd glass${kk==k?' on':''}${kk==K(now)?' today':''}" data-a="pick" data-k="${kk}"><b>${pad(d.getDate())}</b><small>${SH[i]}</small></button>`}).join('')}</div></div>`+srt(k).filter(x=>x.s==null).map(x=>row(x,k,cur)).join('')+tl([k])}
function weekV(){const m=mon(cur),ks=[...Array(7)].map((_,i)=>K(addD(m,i))),us=ks.map(k=>srt(k).filter(x=>x.s==null));
  return `<div class="stk"><div class="wh"><span></span>${ks.map((k,i)=>`<button data-a="pick" data-k="${k}" class="${k==K(now)?'t':''}"><small>${LT[i]}</small><b>${pad(parse(k).getDate())}</b></button>`).join('')}</div>
  `+
  (us.some(u=>u.length)?`<div class="wu"><span></span>${us.map((u,i)=>`<div>${u.slice(0,2).map(x=>`<i data-a="edit" data-k="${ks[i]}" data-id="${x.id}" style="--c:${col(x,parse(ks[i]))}">${x.e} ${esc(x.t)}</i>`).join('')}${u.length>2?`<em>+${u.length-2}</em>`:''}</div>`).join('')}</div>`:'')+'</div>'+tl(ks)}
function monthV(){const s=mon(new Date(cur.getFullYear(),cur.getMonth(),1));let h='<div class="mg">'+LT.map(l=>`<small class="mh">${l}</small>`).join('');
  for(let i=0;i<42;i++){const d=addD(s,i);if(i>=35&&i%7==0&&d.getMonth()!=cur.getMonth())break;const k=K(d);
    h+=`<button class="mc glass${d.getMonth()!=cur.getMonth()?' off':''}${k==K(now)?' tdy':''}" data-a="open" data-k="${k}"><b>${d.getDate()}</b><span class="dots">${srt(k).slice(0,6).map(x=>`<i style="--c:${col(x,d)};opacity:${x.d?.35:1}"></i>`).join('')}</span></button>`}
  return h+'</div>'}
function render(go){
  const st=main.scrollTop;
  main.className='v'+V;main.innerHTML=V=='l'?listV():V=='d'?dayV():V=='w'?weekV():monthV();
  let tt,sub;
  if(V=='l'){tt='Λίστα';let n=0;for(const k in S.t)if(k>=K(now))n+=S.t[k].filter(x=>!x.d).length;sub=n?n+' εκκρεμή':'Όλα έτοιμα 🎉'}
  else if(V=='d'){tt=WD[wd(cur)];sub=`${cur.getDate()} ${MN[cur.getMonth()]} ${cur.getFullYear()}`}
  else if(V=='w'){const m=mon(cur),e=addD(m,6);tt=`${m.getDate()} ${MS[m.getMonth()]} – ${e.getDate()} ${MS[e.getMonth()]}`;sub=e.getFullYear()}
  else{tt=MN[cur.getMonth()];sub=cur.getFullYear()}
  $('tt').textContent=tt;$('st').textContent=sub;$('vi').textContent=VW[V][0];$('vn').textContent=VW[V][1];
  $('pv').style.display=$('nx').style.display=$('td').style.display=V=='l'?'none':'';
  if(go){const el=main.querySelector('.nl');if(el){const y=el.getBoundingClientRect().top-main.getBoundingClientRect().top+main.scrollTop;main.scrollTop=y>main.clientHeight*.7?y-main.clientHeight*.4:0}else main.scrollTop=0}else main.scrollTop=st}
function setV(v){V=S.v=v;save();render(1)}
function nav(n){if(V=='d')cur=addD(cur,n);else if(V=='w')cur=addD(cur,7*n);else if(V=='m'){const d=new Date(cur.getFullYear(),cur.getMonth()+n,1);cur=d.getMonth()==now.getMonth()&&d.getFullYear()==now.getFullYear()?new Date(now):d}render(1)}
function zoom(dir){const o=['m','w','d'],i=o.indexOf(V)+dir;if(V=='l'||i<0||i>2)return;setV(o[i])}
function burst(x,y,n){for(let k=0;k<n;k++){const s=document.createElement('span'),a=Math.random()*6.28,r=50+Math.random()*80;s.className='cf';s.textContent=CF[Math.random()*CF.length|0];s.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r-40}px;--rt:${(Math.random()-.5)*540}deg`;document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}
const openSh=h=>{$('sh').innerHTML=h;$('ov').classList.add('on')},closeSh=()=>$('ov').classList.remove('on');
function sheet(k,id){ed={k,id};const x=id?find(k,id):null,c=x&&x.c!=null?x.c:wd(parse(k));
  openSh(`<div class="f"><input id="f-t" maxlength="80" placeholder="Τι πρέπει να κάνεις;" value="${x?esc(x.t):''}"><input id="f-d" type="date" value="${k}"><div class="r2"><label>Αρχή<input id="f-s" type="time" value="${x&&x.s!=null?m2t(x.s):''}"></label><label>Τέλος<input id="f-n" type="time" value="${x&&x.n!=null?m2t(x.n):''}"></label></div><div class="cp" id="f-c">${PAL.map((p,i)=>`<i data-c="${i}" style="--c:${p}" class="${i==c?'on':''}"></i>`).join('')}</div>${x?`<label class="ck"><input type="checkbox" id="f-x" ${x.d?'checked':''}> Ολοκληρώθηκε</label>`:`<select id="f-r"><option value="0">Δεν επαναλαμβάνεται</option><option value="1">🔁 Κάθε εβδομάδα (24 φορές)</option></select>`}<button class="btn" id="f-ok">Αποθήκευση</button>${x?'<button class="btn g r" id="f-del">Διαγραφή</button>':''}</div>`);
  if(!x)setTimeout(()=>$('f-t').focus(),280)}
function saveT(){const v=$('f-t').value.trim();if(!v)return $('f-t').focus();
  const nk=$('f-d').value||ed.k,s=$('f-s').value,n=$('f-n').value,c=+document.querySelector('#f-c .on').dataset.c,sm=s?t2m(s):null,nn=s&&n&&t2m(n)>t2m(s)?t2m(n):null,x=ed.id?find(ed.k,ed.id):null;
  if(x){if(v!==x.t)[x.e,x.t]=emo(v);x.s=sm;x.n=nn;x.c=c;x.d=$('f-x').checked;if(nk!=ed.k){S.t[ed.k]=S.t[ed.k].filter(y=>y!==x);(S.t[nk]=S.t[nk]||[]).push(x)}}
  else{const[e,t]=emo(v),id=Date.now().toString(36)+Math.random().toString(36).slice(2,5),r=$('f-r').value=='1'?24:1;for(let j=0;j<r;j++){const k2=K(addD(parse(nk),j*7));(S.t[k2]=S.t[k2]||[]).push({id,t,e,d:false,s:sm,n:nn,c})}}
  save();closeSh();cur=parse(nk);render()}
function delT(){const{k,id}=ed;let n=0;for(const d in S.t)n+=S.t[d].filter(y=>y.id==id).length;
  if(n>1&&confirm("🔁 Επαναλαμβανόμενη εργασία!\n\n[OK] Διαγραφή από ΟΛΕΣ τις εβδομάδες\n[ΑΚΥΡΩΣΗ] Διαγραφή μόνο από αυτή τη μέρα")){for(const d in S.t)S.t[d]=S.t[d].filter(y=>y.id!=id)}else S.t[k]=S.t[k].filter(y=>y.id!=id);
  save();closeSh();render()}
$('ov').addEventListener('click',e=>{const t=e.target;if(t.id=='ov')return closeSh();
  if(t.dataset.c!=null){document.querySelectorAll('#f-c i').forEach(i=>i.classList.toggle('on',i==t));return}
  if(t.id=='f-ok')return saveT();if(t.id=='f-del')return delT();
  const th=t.closest('[data-th]');if(th){S.th=th.dataset.th;save();applyTh(S.th);return closeSh()}
  const vw=t.closest('[data-vw]');if(vw){closeSh();setV(vw.dataset.vw)}});
$('vb').onclick=()=>openSh('<div class="f">'+Object.entries(VW).map(([k,[i,n,s]])=>`<button class="opt${k==V?' on':''}" data-vw="${k}"><span class="oi">${i}</span><div><b>${n}</b><small>${s}</small></div></button>`).join('')+'</div>');
$('tb').onclick=()=>openSh('<div class="ths">'+Object.entries(TH).map(([k,t])=>`<button data-th="${k}" class="${(S.th||'dusk')==k?'on':''}"><i style="background:linear-gradient(135deg,${t[2]},${t[1]} 60%,${t[3]})"></i>${t[0]}</button>`).join('')+'</div>');
$('nw').onclick=()=>sheet(K(V=='l'?now:cur),null);
$('pv').onclick=()=>nav(-1);$('nx').onclick=()=>nav(1);$('td').onclick=()=>{cur=new Date(now);render(1)};
main.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a=='open'){cur=parse(b.dataset.k);return setV('d')}
  if(a=='pick'){cur=parse(b.dataset.k);return V=='w'?setV('d'):render(1)}
  const el=b.closest('[data-id]');if(!el)return;const k=el.dataset.k,id=el.dataset.id,x=find(k,id);if(!x)return;
  if(a=='tg'){x.d=!x.d;if(x.d){const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,6)}save();render()}
  else sheet(k,id)});
let p0=0,sx=null,sy=0;const dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
main.addEventListener('touchstart',e=>{if(e.touches.length==2){p0=dist(e);sx=null}else{p0=0;sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
main.addEventListener('touchmove',e=>{if(e.touches.length==2&&p0){const r=dist(e)/p0;if(r>1.3){p0=0;zoom(1)}else if(r<.75){p0=0;zoom(-1)}}},{passive:true});
main.addEventListener('touchend',e=>{if(sx==null||e.touches.length)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(V!='l'&&Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2)nav(dx<0?1:-1)},{passive:true});
document.addEventListener('gesturestart',e=>e.preventDefault());
applyTh(S.th);save();render(1);
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
</script>
